# Production overlay, used instead of compose.override.yaml:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# On the VPS this is run by .github/workflows/deploy-on-vps.yml with prebuilt
# GHCR images. Locally, `APP_SHA=local ... up -d --build` builds them instead.
#
# Public traffic arrives only through the Cloudflare Tunnel, which cloudflared
# opens as an outbound connection, so no host ports are published. The tunnel
# route (configured in the Cloudflare dashboard) points at http://frontend:8080.
#
# Secrets have no defaults here: a missing .env must stop the stack rather
# than start it with the dev placeholders from compose.yaml.
#
# Resource limits live here, not in compose.yaml, so development runs without
# values sized for the VPS. Each service gets mem_limit, an equal memswap_limit
# (no swap) and pids_limit. No oom_score_adj: the app keeps the default 0,
# below the observability stack's 500. No CPU limits or reservations.
# docs/VPS_RESOURCE_BUDGET.md, Container limits, has the evidence for each value.
# scripts/observability-limits-check.sh pins the memory limits, so change a
# value there in the same commit.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256

  # Images built and pushed by .github/workflows/build-and-push.yml. APP_SHA is the deployed
  # commit; the deploy workflow writes it into the VPS .env and rolls it back on failure.
  backend:
    image: ghcr.io/pawelzajglicz/nimuairy-api:${APP_SHA:?set APP_SHA in .env}
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    # No JVM flag sets the heap, so the JVM sizes it from this limit: a quarter
    # of it.
    mem_limit: 1792m
    memswap_limit: 1792m
    pids_limit: 1024

  frontend:
    image: ghcr.io/pawelzajglicz/nimuairy-frontend:${APP_SHA:?set APP_SHA in .env}
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128

  cloudflared:
    container_name: cloudflared-nimuairy
    image: cloudflare/cloudflared:2026.10.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Read from the environment rather than passed as --token, which would
      # show it in the host's process list. `docker inspect` still shows it
      # (Config.Env), as it does every secret in this file; see
      # docs/DEFERRED_WORK.md.
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:?set CLOUDFLARED_TOKEN in .env}
    depends_on:
      - frontend
    networks:
      - frontend
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
