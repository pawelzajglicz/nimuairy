services:
  postgres:
    container_name: postgres-nimuairy
    # Docker Hardened Image (dhi.io) build. Requires `docker login dhi.io`
    # (free Community tier: docker.com/products/hardened-images).
    #
    # The 18-alpine3.23 tag's entrypoint is currently broken (exec format
    # error) - verified, so this uses the debian-13-based tag instead.
    # PG 18 also switched to a version-scoped data directory
    # (/var/lib/postgresql/18/data), so the volume is mounted at the parent
    # /var/lib/postgresql per upstream's own guidance, rather than directly
    # at .../data like the old layout.
    image: dhi.io/postgres:18-debian13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-user}
      POSTGRES_DB: ${POSTGRES_DB:-nimuairy}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-nimuairy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  backend:
    container_name: backend-nimuairy
    build:
      context: ./nimuairy-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nimuairy}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-user}
      JWT_SECRET: ${JWT_SECRET:-nimuairy-jwt-secret-key-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
    # No container-level healthcheck: the hardened runtime image has no
    # shell/curl to run one against. Nothing else in this file gates on the
    # backend's health (only frontend->backend start order, not readiness).
    networks:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    container_name: frontend-nimuairy
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - frontend
    restart: unless-stopped

# The backend is the only service on both networks, so frontend and postgres
# never share one. The backend network is internal: without the dev override,
# postgres is reachable only from the backend, with no route to the host or
# the internet. No host ports are published here:
# compose.override.yaml publishes them for local development, and
# compose.prod.yaml exposes the app through a Cloudflare Tunnel instead.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres:
    driver: local
