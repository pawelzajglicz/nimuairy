stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    block:
      version: vParquet4

overrides:
  defaults:
    # Tempo 3 removed the compactor block that held the course's 7-day retention; its own
    # default is 14 days.
    compaction:
      block_retention: 168h
    metrics_generator:
      processors: []

usage_report:
  reporting_enabled: false
