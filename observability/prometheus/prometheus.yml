global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    stack: observability

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # The OpenTelemetry Java agent's Prometheus exporter in the backend. The target is down
  # until compose.observability.yaml attaches the backend to the observability network.
  - job_name: nimuairy-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-nimuairy:9464"]
        labels:
          # The exporter puts service.name only on target_info, not on each series.
          service_name: nimuairy-api
