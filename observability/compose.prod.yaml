# Production overlay for the stack in this directory. On the VPS, every command that creates or
# recreates the stack's containers must pass exactly both files:
#   docker compose -f observability/compose.yaml -f observability/compose.prod.yaml up -d --wait
# Compose otherwise recreates them without these settings. CI's observability job runs the stack
# with both files plus compose.test.yaml, a test-only overlay that publishes again the ports its
# tests use, so the tests run within these limits. Development uses compose.yaml alone, so values
# sized for the VPS (one CPU, 4.25 GiB) never change a development run, and it keeps its ports.
#
# It holds three kinds of settings; docs/OBSERVABILITY.md, Resource limits, says how they apply.
# scripts/observability-limits-check.sh admits only these keys, each only on the services that
# carry it here, and the top-level secrets.
# - Resource limits and oom_score_adj, on every service. docs/VPS_RESOURCE_BUDGET.md, Container
#   limits, has the values' evidence and conditions; scripts/observability-limits-check.sh checks
#   them.
#   - memswap_limit equals mem_limit, so no container uses swap.
#   - oom_score_adj 500 makes the kernel prefer these processes over the app's when the whole VPS
#     runs out of memory. It ranks processes; it protects nothing.
#   - No CPU limits or reservations (docs/DEFERRED_WORK.md, CPU weights).
# - Port resets on prometheus, loki, tempo and alloy, so Grafana's 127.0.0.1:3000, the SSH tunnel's
#   endpoint, is the only host port (docs/S4b_DESIGN_CONTRACT.md, section 5). The services still
#   reach one another over the Docker networks. Compose merges ports across files, so only !reset
#   removes them. scripts/observability-prod-check.sh pins the exact mappings of each render.
# - Grafana's admin password, from the file secret ./secrets/grafana_admin_password, which Git
#   ignores, in place of the base file's admin (docs/S4b_DESIGN_CONTRACT.md, section 6). CI writes
#   a disposable one for each run. scripts/observability-prod-check.sh pins Grafana's environment,
#   secret and entrypoint, and the top-level secret.
services:
  prometheus:
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    oom_score_adj: 500
    ports: !reset []

  loki:
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    oom_score_adj: 500
    ports: !reset []

  # A provisional ceiling: Tempo's steady state over its full 168 h retention is not known yet.
  tempo:
    mem_limit: 1024m
    memswap_limit: 1024m
    pids_limit: 256
    oom_score_adj: 500
    ports: !reset []

  alloy:
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    oom_score_adj: 500
    ports: !reset []

  docker-socket-proxy:
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 128
    oom_score_adj: 500

  grafana:
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    oom_score_adj: 500
    environment:
      GF_SECURITY_ADMIN_PASSWORD: !reset null
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets: [grafana_admin_password]
    # The start guard (docs/S4b_DESIGN_CONTRACT.md, section 6.3). With an empty or unreadable file,
    # or a directory in its place, the image's /run.sh would leave Grafana on the base file's admin,
    # and a new database would store it; so Grafana does not start. Docker Desktop mounts a
    # directory it creates when the file is missing, and a directory passes -r and -s, hence -f.
    # $$ escapes Compose's interpolation.
    entrypoint:
      - /bin/bash
      - -c
      - |
        f=/run/secrets/grafana_admin_password
        if [ ! -f "$$f" ] || [ ! -r "$$f" ] || [ ! -s "$$f" ]; then echo "FATAL: $$f is missing, not a regular file, unreadable or empty" >&2; exit 1; fi
        if [ "$$(< "$$f")" = admin ]; then echo "FATAL: $$f holds the development password" >&2; exit 1; fi
        exec /run.sh "$$@"
      - run.sh

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
