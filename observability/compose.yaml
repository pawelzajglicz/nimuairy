# Local observability stack, vendored from the course; see docs/OBSERVABILITY.md for the
# changes made here and how to run, verify and update it. Ports are bound to 127.0.0.1, as in
# compose.override.yaml: Docker's port publishing bypasses host firewall rules, and Grafana's
# admin/admin login and the unauthenticated Loki and Tempo endpoints must stay off the LAN.
name: nimuairy-observability

networks:
  # Shared with the app: compose.observability.yaml attaches the backend as an external network.
  # Only Tempo (trace intake) and Prometheus (scrape) join it, so the backend shares no network with
  # Loki, Grafana or Alloy (docs/OBSERVABILITY.md, Networks, has what that does and does not block).
  # Keep its key, name and settings unchanged: Compose would have to recreate it, which fails while
  # the backend, from another project, is attached.
  observability:
    name: nimuairy-observability
    driver: bridge
  # The stack's own traffic. Not internal: Docker publishes a container's ports only through a
  # non-internal network, and every service here publishes one.
  stack:
    driver: bridge
  # Alloy and the Docker socket proxy only. Internal: neither publishes a port through it (Alloy
  # publishes through stack), and the proxy needs no traffic beyond Alloy's requests.
  docker-api:
    driver: bridge
    internal: true

volumes:
  prom-data: {}
  loki-data: {}
  tempo-data: {}
  grafana-data: {}
  alloy-data: {}

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    networks: [observability, stack]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml", "-target=all"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [stack]
    # Image is distroless (no shell, no wget/curl) — Compose can only check
    # that the process is running. Grafana waits for `service_started` and
    # retries the datasource connection on its own.

  tempo:
    image: grafana/tempo:3.1.1
    container_name: tempo
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"   # Tempo HTTP API
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [observability, stack]
    # Distroless image — see comment on `loki`.

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    user: "0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"  # Alloy UI / debug
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks: [stack, docker-api]
    # Orders `up` only: the proxy can open the socket before Alloy starts, and a proxy that cannot
    # fails `up --wait`. It does not mean the proxy's API answers, and a daemon restart ignores it;
    # Alloy retries the Docker API every 5 s (docs/OBSERVABILITY.md, Docker API access).
    depends_on:
      loki:
        condition: service_started
      docker-socket-proxy:
        condition: service_healthy
    # Distroless image — see comment on `loki`.

  # The only service that mounts the Docker socket (root-equivalent). It passes on the read calls
  # Alloy makes and refuses everything else (docs/OBSERVABILITY.md, Docker API access).
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.2
    container_name: docker-socket-proxy
    restart: unless-stopped
    # The socket's group: 0 on Docker Desktop (root:root 0660); on Linux the docker group, set as
    # DOCKER_SOCKET_GID in observability/.env. A wrong group fails closed: the proxy exits.
    user: "65534:${DOCKER_SOCKET_GID:-0}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - -listenip=0.0.0.0
      - -allowfrom=alloy
      - -allowHEAD=/_ping
      - '-allowGET=/v1\.[0-9]+/(containers/json|networks|containers/[0-9a-f]{64}/(json|logs))'
      - -allowhealthcheck
      # After a Docker upgrade with live-restore the bind-mounted socket goes stale; exiting lets
      # the restart policy mount the new one.
      - -watchdoginterval=60
      - -stoponwatchdog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    # Reports whether the proxy can open the Docker socket, not whether its API on 2375 answers or
    # its allowlist is right; the smoke test checks those.
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor traceQLStreaming metricsSummary"
      GF_LOG_LEVEL: warn
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [stack]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
