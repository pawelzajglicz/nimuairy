server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSP is the main defence against XSS. 'unsafe-inline' is allowed only for styles because
    # Angular injects component styles as <style> tags. Scripts get no exception, which is why
    # angular.json turns off inlineCritical: it would add an inline <script> to index.html.
    # A location block that sets its own add_header drops these, so keep them out of locations.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend is reached by its Compose service name; the browser never needs
    # to know the backend's address.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
