# Cloudflare serves the app over https but the tunnel hands requests to nginx over plain
# http, so $scheme alone is wrong in production. CF-Visitor carries the scheme the browser
# used; it is absent in local Docker, where the connection's own scheme is right.
map $http_cf_visitor $forwarded_proto {
    ~*"scheme":"https" https;
    default            $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSP is the main defence against XSS. Nothing inline is allowed, which is why angular.json
    # turns off inlineCritical: it would add an inline <script> to index.html.
    # Angular injects component styles as <style> tags, so those carry a nonce: a fresh random
    # $request_id per response, put into index.html by sub_filter below, where Angular reads it.
    # A location block that sets its own add_header drops these, so keep them out of locations.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
        # Also drops ETag and Last-Modified, so the browser cannot revalidate a cached
        # index.html (old nonce) against a 304 that carries the new nonce's header.
        sub_filter 'NGINX_CSP_NONCE' $request_id;
        # The Angular build copies the placeholder onto its <script> tags too.
        sub_filter_once off;
    }

    # Backend is reached by its Compose service name; the browser never needs
    # to know the backend's address.
    # X-Forwarded-Host/Proto let the backend rebuild the browser-facing origin
    # (server.forward-headers-strategy). Without them it treats same-origin
    # requests as cross-origin and its CORS filter rejects them.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
