<div class="battle-board-stack">
  <app-board-grid
    [board]="battleState()?.board"
    [unitPositions]="unitPositions()"
    (cellClick)="onCellClick($event)"
  />
  <app-entity-layer
    [battleState]="battleState()"
    [selectedUnitId]="selectedUnitId()"
    [interactionMode]="interactionMode()"
    (unitClick)="onUnitClick($event)"
  />
  <app-movement-overlay
    [board]="battleState()?.board"
    [destinations]="reachableDestinations()"
    [preview]="movementPreview()"
    [unit]="selectedUnit()"
    (destinationHover)="destinationHover.emit($event)"
    (destinationClick)="onDestinationClick($event)"
  />
</div>
