@if (board(); as board) {
  <div
    class="entity-layer"
    [style.grid-template-columns]="'repeat(' + board.width + ', 1fr)'"
    [style.grid-template-rows]="'repeat(' + board.height + ', 1fr)'"
    [style.aspect-ratio]="board.width + ' / ' + board.height"
  >
    @for (cell of entityCells(); track cell.key) {
      <div
        class="entity-cell"
        [attr.data-kind]="cell.kind"
        [attr.data-owner]="cell.owner"
        [style.grid-column]="cell.gridColumn"
        [style.grid-row]="cell.gridRow"
      ></div>
    }
  </div>
}
