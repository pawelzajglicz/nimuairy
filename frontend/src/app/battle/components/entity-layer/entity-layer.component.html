@if (board(); as board) {
  <div
    class="entity-layer"
    [style.grid-template-columns]="'repeat(' + board.width + ', 1fr)'"
    [style.grid-template-rows]="'repeat(' + board.height + ', 1fr)'"
    [style.aspect-ratio]="board.width + ' / ' + board.height"
  >
    @for (cell of entityCells(); track cell.key) {
      @if (cell.kind === 'unit' || isAttackTarget(cell)) {
        <button
          type="button"
          class="entity-cell"
          [class.selected]="isSelected(cell)"
          [class.dimmed]="isDimmed(cell)"
          [class.attack-target]="isAttackTarget(cell)"
          [class.attacked]="isAttacked(cell)"
          [attr.data-selection-mode]="selectionMode(cell)"
          [attr.data-kind]="cell.kind"
          [attr.data-owner]="cell.owner"
          [attr.data-destroyed]="cell.destroyed || null"
          [attr.aria-label]="
            isAttackTarget(cell) ? attackLabel(cell) : cell.owner + ' unit'
          "
          [style.grid-column]="cell.gridColumn"
          [style.grid-row]="cell.gridRow"
          (click)="onEntityCellClick(cell)"
        ></button>
      } @else {
        <div
          class="entity-cell"
          [class.attacked]="isAttacked(cell)"
          [attr.data-kind]="cell.kind"
          [attr.data-owner]="cell.owner"
          [attr.data-destroyed]="cell.destroyed || null"
          [style.grid-column]="cell.gridColumn"
          [style.grid-row]="cell.gridRow"
        ></div>
      }
    }
  </div>
}
