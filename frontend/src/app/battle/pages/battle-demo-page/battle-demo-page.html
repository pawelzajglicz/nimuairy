@if (store.loading()) {
  <p>Loading battle…</p>
} @else if (store.error()) {
  <p>Failed to load the demo battle.</p>
} @else if (store.battleState(); as battleState) {
  <div class="battle-layout">
    <app-interaction-mode-controls
      [mode]="store.interactionMode()"
      (modeChange)="store.setInteractionMode($event)"
    />
    <app-movement-info
      [unit]="store.selectedUnit()"
      [currentPlayer]="battleState.currentPlayer"
      [unavailable]="store.movementUnavailable()"
      [preview]="store.movementPreview()"
      [lastOutcome]="store.lastOutcome()"
      (resetMovement)="store.resetSelectedUnitMovement()"
    />
    <app-battle-board
      [battleState]="battleState"
      [selectedUnitId]="store.selectedUnitId()"
      [interactionMode]="store.interactionMode()"
      [reachableDestinations]="store.reachableDestinations()"
      [movementPreview]="store.movementPreview()"
      (interaction)="onBoardInteraction($event)"
      (destinationHover)="store.hoverDestination($event)"
    />
  </div>
}
