spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nimuairy
    username: user
    password: user
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# ng serve runs on plain http. Chrome and Firefox accept Secure cookies on localhost anyway, but
# other browsers may not, so dev drops the flag rather than depend on that.
jwt:
  cookie-secure: false
