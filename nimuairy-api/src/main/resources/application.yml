spring:
  application:
    name: nimuairy-api
  servlet:
    multipart:
      max-file-size: 50MB
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: nimuairy-jwt-secret-key-change-in-production-min-32-chars
  expiration-ms: 86400000

springdoc:
  swagger-ui:
    # Swagger UI copies the XSRF-TOKEN cookie into X-XSRF-TOKEN, as the SPA does,
    # so POST/PUT/DELETE keep working there with CSRF protection on.
    csrf:
      enabled: true

server:
  port: 8000
  # The backend sits behind nginx, so its own scheme/host/port differ from the browser's.
  # Reading X-Forwarded-* lets the CORS filter recognise same-origin requests as such.
  forward-headers-strategy: framework
