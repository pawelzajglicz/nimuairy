name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

# A new push to a PR supersedes the run in progress; master runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs run only the areas they touch. Pushes to master, nightly and manual runs always run
  # everything as a safety net. Backend PRs reach the frontend only through openapi.json,
  # the committed contract snapshot guarded by OpenApiSnapshotTest.
  #
  # TODO(2027-04): revisit test selection. Filtering is per area only, so a touched area runs
  # all of its tests. If a job regularly exceeds ~10 min, consider running only the tests
  # affected by the change (e.g. Vitest `--changed`); until then it is not worth the risk
  # of skipping a relevant test.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR checks out its merge commit, so HEAD^1 is the base branch tip.
          fetch-depth: 2
      - id: filter
        run: |
          frontend=false
          backend=false
          observability=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            frontend=true
            backend=true
            observability=true
          else
            while read -r file; do
              case "$file" in
                .github/workflows/*) frontend=true; backend=true; observability=true ;;
                nimuairy-api/openapi.json) frontend=true; backend=true ;;
                frontend/*) frontend=true ;;
                nimuairy-api/*) backend=true ;;
                observability/* | compose.yaml | compose.override.yaml | compose.prod.yaml | \
                  compose.observability*.yaml | \
                  scripts/observability-smoke-test.sh | scripts/observability-proxy-resilience-check.sh | \
                  scripts/observability-limits-check.sh | scripts/observability-prod-check.sh)
                  observability=true ;;
              esac
            # --no-renames lists both paths of a move, so moving a file out of an area still
            # runs that area's checks.
            done < <(git diff --no-renames --name-only HEAD^1 HEAD)
          fi
          echo "frontend=$frontend backend=$backend observability=$observability"
          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "observability=$observability"
          } >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Playwright runs the e2e specs without type-checking them.
      - run: npx tsc -p e2e
      - run: npm run format:check
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nimuairy-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw test

  # Nothing else in CI starts the local stack in observability/, yet Dependabot bumps its images
  # and a major version can need config changes (Tempo 3 did). `up --wait` alone would pass a
  # broken stack: Loki, Tempo and Alloy have no healthcheck, so a service that crash-loops on its
  # config still counts as started. The smoke test polls each service instead. The backend is not
  # started, only its overlay validated; docs/OBSERVABILITY.md lists the checks that need it.
  # After the smoke test, a second script stops the Docker socket proxy for a while and checks
  # that Alloy resumes log collection without a restart.
  # The stack runs with its production overlay, observability/compose.prod.yaml, so both tests run
  # within its memory and PID limits. That overlay also removes every host port but Grafana's, which
  # the tests need, so the test overlay, observability/compose.test.yaml, publishes again the
  # loopback ports they use. The test overlay is for test runs only: a VPS command passes exactly
  # compose.yaml and compose.prod.yaml. The production overlay also reads Grafana's admin password
  # from a file; the job writes a disposable one for each run, and the smoke test logs in with it.
  # Before the start, the limits check and the production check verify the renders, the latter the
  # exact host port mappings of the development, production and test renders and Grafana's
  # production password settings. The limits check also verifies the running containers after the
  # tests, and the app's production render (compose.yaml + compose.prod.yaml) for its limits; the
  # app itself is not started here.
  observability:
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Docker socket proxy runs with the socket's group (observability/compose.yaml).
      - name: Set Docker socket GID
        run: echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      # A new, disposable Grafana admin password for each run: the production overlay reads it from
      # this file, which Git ignores, and the smoke test logs in with GRAFANA_AUTH. The mask comes
      # first, because later steps' logs show the values in GITHUB_ENV. Mode 0644: Grafana (472)
      # reads the bind-mounted file with the host file's owner and mode.
      - name: Disposable Grafana password
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          mkdir -p observability/secrets
          printf '%s' "$password" > observability/secrets/grafana_admin_password
          chmod 0644 observability/secrets/grafana_admin_password
          echo "GRAFANA_AUTH=admin:$password" >> "$GITHUB_ENV"
      - name: Validate the Compose files
        run: |
          docker compose -f observability/compose.yaml config -q
          docker compose -f observability/compose.yaml -f observability/compose.prod.yaml config -q
          docker compose -f observability/compose.yaml -f observability/compose.prod.yaml \
            -f observability/compose.test.yaml config -q
          docker compose -f compose.yaml -f compose.override.yaml \
            -f compose.observability.yaml -f compose.observability.dev.yaml config -q
      # Every stack service gets its limits from the overlay, every app service gets its pinned
      # memory limit from compose.prod.yaml, and the base and development renders get none.
      - name: Production limits in the render
        run: bash scripts/observability-limits-check.sh static
      # Production publishes only Grafana's 127.0.0.1:3000; the development and test renders keep
      # exactly their pinned mappings, and no render uses the host network. Production Grafana reads
      # its password only from the secret file and has the start guard; development needs neither.
      - name: Production ports and Grafana secret in the render
        run: bash scripts/observability-prod-check.sh static
      # With the test overlay, which never joins a VPS command.
      - id: up
        run: |
          docker compose -f observability/compose.yaml -f observability/compose.prod.yaml \
            -f observability/compose.test.yaml up -d --wait --wait-timeout 180
      # Logs in to Grafana with GRAFANA_AUTH, the disposable password.
      - run: bash scripts/observability-smoke-test.sh
      # Only after a green smoke test: an outage means something only on a stack whose boundary
      # passed. Its own limit leaves the job time for the checks below if the script hangs.
      - name: Socket proxy outage
        run: bash scripts/observability-proxy-resilience-check.sh
        timeout-minutes: 6
      # After the tests, so that an OOM kill or a restart during them shows; also when one of them
      # failed. Without a started stack there is nothing to check. It compares the containers with
      # the render of compose.yaml + compose.prod.yaml: the test overlay changes only ports, which it
      # does not read.
      - name: Production limits on the running stack
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: bash scripts/observability-limits-check.sh runtime
      # The tests remove their probe containers when they exit; one left over means that failed.
      # docker ps ORs the name filters.
      - name: No probe containers left
        if: always()
        run: |
          test -z "$(docker ps -aq --filter name=observability-smoke-test --filter name=observability-proxy-resilience \
            --filter name=observability-limits-check)"
      # The outage check restores the proxy on exit, but a killed script cannot, and a proxy
      # stopped by hand stays stopped (restart: unless-stopped).
      - name: Socket proxy running again
        if: always()
        run: test "$(docker inspect -f '{{.State.Running}} {{.State.Health.Status}}' docker-socket-proxy)" = "true healthy"
      - name: Stack status and logs
        if: failure()
        run: |
          docker compose -f observability/compose.yaml -f observability/compose.prod.yaml ps -a
          docker compose -f observability/compose.yaml -f observability/compose.prod.yaml logs --no-color

  # Nightly-only: catches advisories published after the last PR. Only high/critical fail the
  # run; lower ones are left to the weekly Dependabot updates. Unlike the Trivy SCA scan, it also
  # covers devDependencies, i.e. the build tooling that runs in CI.
  npm-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
      - run: npm audit --audit-level=high

  # The single check to mark as required in branch protection: skipped jobs count as passed,
  # failed or cancelled ones do not.
  ci-result:
    needs: [changes, frontend, backend, observability, npm-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
