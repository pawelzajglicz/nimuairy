name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

# A new push to a PR supersedes the run in progress; master runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs run only the areas they touch. Pushes to master, nightly and manual runs always run
  # everything as a safety net. Backend PRs reach the frontend only through openapi.json,
  # the committed contract snapshot guarded by OpenApiSnapshotTest.
  #
  # TODO(2027-04): revisit test selection. Filtering is per area only, so a touched area runs
  # all of its tests. If a job regularly exceeds ~10 min, consider running only the tests
  # affected by the change (e.g. Vitest `--changed`); until then it is not worth the risk
  # of skipping a relevant test.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR checks out its merge commit, so HEAD^1 is the base branch tip.
          fetch-depth: 2
      - id: filter
        run: |
          frontend=false
          backend=false
          observability=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            frontend=true
            backend=true
            observability=true
          else
            while read -r file; do
              case "$file" in
                .github/workflows/*) frontend=true; backend=true; observability=true ;;
                nimuairy-api/openapi.json) frontend=true; backend=true ;;
                frontend/*) frontend=true ;;
                nimuairy-api/*) backend=true ;;
                observability/* | compose.yaml | compose.override.yaml | compose.observability*.yaml | \
                  scripts/observability-smoke-test.sh) observability=true ;;
              esac
            # --no-renames lists both paths of a move, so moving a file out of an area still
            # runs that area's checks.
            done < <(git diff --no-renames --name-only HEAD^1 HEAD)
          fi
          echo "frontend=$frontend backend=$backend observability=$observability"
          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "observability=$observability"
          } >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Playwright runs the e2e specs without type-checking them.
      - run: npx tsc -p e2e
      - run: npm run format:check
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nimuairy-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw test

  # Nothing else in CI starts the local stack in observability/, yet Dependabot bumps its images
  # and a major version can need config changes (Tempo 3 did). `up --wait` alone would pass a
  # broken stack: Loki, Tempo and Alloy have no healthcheck, so a service that crash-loops on its
  # config still counts as started. The smoke test polls each service instead. The backend is not
  # started, only its overlay validated; docs/OBSERVABILITY.md lists the checks that need it.
  observability:
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Docker socket proxy runs with the socket's group (observability/compose.yaml).
      - name: Set Docker socket GID
        run: echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"
      - name: Validate the Compose files
        run: |
          docker compose -f observability/compose.yaml config -q
          docker compose -f compose.yaml -f compose.override.yaml \
            -f compose.observability.yaml -f compose.observability.dev.yaml config -q
      - run: docker compose -f observability/compose.yaml up -d --wait --wait-timeout 180
      - run: bash scripts/observability-smoke-test.sh
      # The smoke test removes its probe containers when it exits; one left over means that failed.
      - name: No probe containers left
        if: always()
        run: test -z "$(docker ps -aq --filter name=observability-smoke-test)"
      - name: Stack status and logs
        if: failure()
        run: |
          docker compose -f observability/compose.yaml ps -a
          docker compose -f observability/compose.yaml logs --no-color

  # Nightly-only: catches advisories published after the last PR. Only high/critical fail the
  # run; lower ones are left to the weekly Dependabot updates. Unlike the Trivy SCA scan, it also
  # covers devDependencies, i.e. the build tooling that runs in CI.
  npm-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
      - run: npm audit --audit-level=high

  # The single check to mark as required in branch protection: skipped jobs count as passed,
  # failed or cancelled ones do not.
  ci-result:
    needs: [changes, frontend, backend, observability, npm-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
