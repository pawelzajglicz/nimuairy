name: Build and push

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Images are tagged only with the full commit SHA, never `latest`: release.yml deploys an exact
# SHA, and rollback restores the previous one from the VPS .env.
jobs:
  build:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: frontend
            image: nimuairy-frontend
          - context: nimuairy-api
            image: nimuairy-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GHCR rejects uppercase in image names, while the repository owner may contain it.
      - name: Resolve image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "name=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      # The Dockerfiles build on Docker Hardened Images, which need a login even to pull.
      - name: Log in to dhi.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Adds the OCI labels; org.opencontainers.image.source links the package to this repository,
      # so it inherits the repository's access settings.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=raw,value=${{ github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read-only reuse of the layer cache that security.yml writes for the same images on
          # master. Not writing it here keeps the published images from feeding a shared cache.
          cache-from: type=gha,scope=${{ matrix.context }}
