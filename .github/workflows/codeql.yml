name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly as well, because new CodeQL queries can find issues in code that has not changed.
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

# A new push to a PR supersedes the run in progress; master runs are never cancelled.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Analysis never fails the run on its own findings. PRs are gated by the ruleset's "Require code
# scanning results" rule, which compares against the latest master analysis — hence the master
# pushes. This keeps the threshold in one place instead of a custom gate per workflow.
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none analyses the sources without compiling, so no Java/Node setup or Maven
        # build is needed. `actions` covers the workflows themselves (e.g. template injection).
        language: [java-kotlin, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
